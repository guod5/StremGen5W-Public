name: Build Android 4.4 APK and NEMESIS USB installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;21.4.7075529' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify public release contains no hardcoded personal information
        run: python3 tools/public_release_check.py
      - name: Build pinned FFmpeg audio codecs for Android 4.4 ARMv7
        shell: bash
        run: bash tools/build_ffmpeg_audio.sh
      - name: Verify selected Stremio Auto pixel launcher icon
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/stremio_auto_icon.webp
          echo 'c9f15f0074cb946b70355d9c8adb2f075d8fe5212424303ba3d96c6dd9194397  app/src/main/res/drawable-nodpi/stremio_auto_icon.webp' | sha256sum --check
          file app/src/main/res/drawable-nodpi/stremio_auto_icon.webp
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package NEMESIS
        run: python3 tools/package_nemesis.py app/build/outputs/apk/debug/app-debug.apk dist
      - name: Export clean v1.0.0 source without Git history
        run: |
          git archive --format=zip --output=dist/Stremio-gen5-hmg-nemesis-v1.0.0-Source.zip HEAD
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/Stremio-gen5-hmg-nemesis-v1.0.0-Source.zip'); assert z.testzip() is None and all(not p.startswith('.git/') for p in z.namelist())"
      - name: Validate and name official NEMESIS USB installer
        shell: bash
        run: |
          grep -F 'android:label="Stremio Auto"' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import pathlib
          import re
          import shutil
          import zipfile
          from io import BytesIO
          src = pathlib.Path("dist/stremio-auto-nemesis-usb.zip")
          dst = pathlib.Path("dist/Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip")
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {"NEMESIS.data", "NEMESIS.sh", "packages/stremio-auto.zip"}
              assert "version=1.0.0" in z.read("NEMESIS.data").decode("utf-8")
              assert "EXPECTED_CODE=25" in z.read("NEMESIS.sh").decode("utf-8")
              package = z.read("packages/stremio-auto.zip")
          with zipfile.ZipFile(BytesIO(package)) as z:
              assert z.testzip() is None
              data = z.read("NEMESIS.data").decode("utf-8")
              assert "version=1.0.0" in data and "name=Stremio Auto" in data
              assert "path=app/StremioAuto.apk" in data
              apk = z.read("app/StremioAuto.apk")
          with zipfile.ZipFile(BytesIO(apk)) as z:
              assert z.testzip() is None
              dex = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
              for pattern in (rb"tim[.]llt", rb"verizon[.]net"):
                  assert re.search(pattern, dex, re.IGNORECASE) is None
              assert any("stremio_auto_icon.webp" in n for n in z.namelist()), "Pixel launcher icon missing from APK"
              icon_bytes = next(z.read(n) for n in z.namelist() if n.endswith("/stremio_auto_icon.webp"))
              assert icon_bytes == pathlib.Path("app/src/main/res/drawable-nodpi/stremio_auto_icon.webp").read_bytes(), "Compiled icon differs from selected image"
              assert all("assets/flags/"+code+".png" in z.namelist() for code in ("gb","us","es","fr","de","jp")), "Bundled language flags missing from APK"
              assert b"FlagText" in dex, "Android 4.4 flag renderer missing from APK"
              assert b"STREMIO AUTO" in dex, "Rebranded in-app name not found"
              assert b"PARKED VEHICLE REQUIRED" in dex, "Parking confirmation absent from compiled APK"
              assert b"parked_confirmed" in dex, "Player acknowledgement guard absent from compiled APK"
              assert b"Exit App" in dex, "Exit option absent from APK"
              for phrase in [b"Motion lockout", b"Disable popup", b"Exit Stremio", b"motion_lockout", b"disable_popup", b"2 mph", b"Yes, Exit", b"VLC integration", b"vlc_integration"]:
                  assert phrase in dex, f"New settings / exit feature missing from APK: {phrase!r}"


          shutil.copyfile(src, dst)
          print(f"Validated public installer: {dst} ({dst.stat().st_size} bytes)")
          PY
          sha256sum dist/Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip
      # One-time migration: release v1.0.0 already exists as an obsolete prototype.
      # Perform this only after APK/installer validation; never rewrite main history.
      - name: Remove obsolete launch tag after validation
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[public-launch-reset]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq '.object.sha' 2>/dev/null || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
            if gh release view v1.0.0 >/dev/null 2>&1; then
              gh release delete v1.0.0 --yes --cleanup-tag
            else
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v1.0.0"
            fi
          fi
      - name: Publish official v1.0.0 GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > dist/release-notes.md <<'NOTES'
          # Stremio Auto v1.0.0 — Public Launch

          Stremio Auto is an **unofficial, community-built Stremio-compatible client** for compatible Android 4.4 Hyundai Motor Group Gen5 head units running NEMESIS. This experimental hobby project was created through extensive AI-assisted development. It is not affiliated with or endorsed by Stremio, Hyundai, Kia, or NEMESIS.

          ### Install using a NEMESIS USB drive

          Download **Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip**. Extract its three contents to the root of a USB drive, insert it into a compatible NEMESIS-enabled head unit, and accept the installation prompt.

          **A clean reinstall resets the app's saved login, preferences, and caches.** Sign in to Stremio again afterward. This installer targets only the Stremio Auto package, not other NEMESIS applications.

          ### Features

          - Stremio account, compatible library and Continue Watching, add-on catalogs, search, and browse.
          - In-app ExoPlayer with seeking, aspect ratio, audio and subtitle selection, preferred English soundtrack, and bundled FFmpeg audio decoding.
          - Bundled language flag graphics for older Android 4.4 screens.
          - Optional VLC handoff setting, with a larger Watch button when off.
          - Parked-use reminder settings, optional experimental GPS motion lockout, and Exit Stremio.
          - Selected purple-blue pixel-play launcher icon and compatible NEMESIS USB installer.

          ### Limitations and safe use

          This is experimental software, not an official Stremio app. Some codecs, sources, synchronization and controls may not work on every head unit. Wireless CarPlay phone-only data routing is unverified. Contributions and bug reports are welcome.

          **Use responsibly. Never watch or operate video while driving.**
          NOTES
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              "dist/Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip" \
              "dist/Stremio-gen5-hmg-nemesis-v1.0.0-Source.zip" --clobber
            gh release edit v1.0.0 \
              --title "Stremio Auto v1.0.0" --notes-file dist/release-notes.md
          else
            gh release create v1.0.0 \
              "dist/Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip" \
              "dist/Stremio-gen5-hmg-nemesis-v1.0.0-Source.zip" \
              --title "Stremio Auto v1.0.0" \
              --notes-file dist/release-notes.md \
              --target "${GITHUB_SHA}"
          fi
      # Explicitly scoped, one-time release cleanup; only after launch is live.
      - name: Remove pre-launch releases and tags
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[public-launch-reset]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.0" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA" || { echo "Launch tag does not match source"; exit 1; }
          gh release view v1.0.0 --json assets --jq '.assets[].name' > /tmp/stremio-launch-assets.txt
          grep -Fx 'Stremio-gen5-hmg-nemesis-v1.0.0-USB-Installer.zip' /tmp/stremio-launch-assets.txt
          grep -Fx 'Stremio-gen5-hmg-nemesis-v1.0.0-Source.zip' /tmp/stremio-launch-assets.txt
          for old in v1.0.1 v2.0.0 v2.0.1 v2.0.2 v2.0.3 v2.0.4; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --yes --cleanup-tag
            elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$old" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/$old"
            fi
          done
          gh release list --limit 25
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags" --jq '.[].ref'
      - uses: actions/upload-artifact@v4
        with:
          name: StremioAuto-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/*.zip
