name: Build Android 4.4 APK and NEMESIS USB installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;21.4.7075529' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify public release contains no hardcoded personal information
        run: python3 tools/public_release_check.py
      - name: Build pinned FFmpeg audio codecs for Android 4.4 ARMv7
        shell: bash
        run: bash tools/build_ffmpeg_audio.sh
      - name: Verify selected Stremio Auto pixel launcher icon
        shell: bash
        run: |
          test -s app/src/main/res/drawable-nodpi/stremio_auto_icon.webp
          echo 'c9f15f0074cb946b70355d9c8adb2f075d8fe5212424303ba3d96c6dd9194397  app/src/main/res/drawable-nodpi/stremio_auto_icon.webp' | sha256sum --check
          file app/src/main/res/drawable-nodpi/stremio_auto_icon.webp
      - name: Validate automatic Stremio account sync implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          player = Path("app/src/main/java/com/gen5/stremio/ExoPlayerActivity.java").read_text()
          main = Path("app/src/main/java/com/gen5/stremio/MainActivity.java").read_text()
          sync = Path("app/src/main/java/com/gen5/stremio/PlaybackSync.java").read_text()
          assert "newSingleThreadExecutor()" in sync, "Cloud writes must be serialized"
          assert 'post("datastoreGet",find)' in sync and 'post("datastorePut",put)' in sync
          assert 'state.put("video_id",videoId)' in sync, "Exact episode ID must sync"
          assert 'item.put("temp",true)' in sync, "Unsaved titles must appear in Continue Watching"
          assert 'item.put("removed",true)' in sync, "Do not auto-add titles to saved Library"
          assert 'optBoolean("success",false)' in sync, "API result must be verified"
          assert "cloudSync.record(lastPosition,lastDuration,watchedElapsedMs,false)" in player
          assert "syncCurrentPosition();" in player and 'protected void onPause()' in player
          assert 'next.putExtra("sync_video_id"' in main
          assert 'void chooseSeriesEpisode()' in main, "Series need an episode picker"
          assert "showManualProgress" not in main and "saveProgress(" not in main
          print("Automatic progress sync / episode / VLC UI checks passed.")
          PY
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package NEMESIS
        run: |
          bash -n svc/netguard.sh scripts/preun.sh
          python3 tools/package_nemesis.py app/build/outputs/apk/debug/app-debug.apk dist
      - name: Export clean v1.1.2 source without Git history
        run: |
          git archive --format=zip --output=dist/Stremio-gen5-hmg-nemesis-v1.1.2-Source.zip HEAD
          python3 -c "import zipfile; z=zipfile.ZipFile('dist/Stremio-gen5-hmg-nemesis-v1.1.2-Source.zip'); assert z.testzip() is None and all(not p.startswith('.git/') for p in z.namelist())"
      - name: Validate and name official NEMESIS USB installer
        shell: bash
        run: |
          grep -F 'android:label="Stremio Auto"' app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import pathlib
          import re
          import shutil
          import zipfile
          from io import BytesIO
          src = pathlib.Path("dist/stremio-auto-nemesis-usb.zip")
          dst = pathlib.Path("dist/Stremio-gen5-hmg-nemesis-v1.1.2-USB-Installer.zip")
          with zipfile.ZipFile(src) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == {"NEMESIS.data", "NEMESIS.sh", "packages/stremio-auto.zip"}
              assert "version=1.1.2" in z.read("NEMESIS.data").decode("utf-8")
              assert "EXPECTED_CODE=29" in z.read("NEMESIS.sh").decode("utf-8")
              package = z.read("packages/stremio-auto.zip")
          with zipfile.ZipFile(BytesIO(package)) as z:
              assert z.testzip() is None
              data = z.read("NEMESIS.data").decode("utf-8")
              assert "version=1.1.2" in data and "name=Stremio Auto" in data
              assert "path=app/StremioAuto.apk" in data
              assert "version=1.1" in data and "package-version=1.1.2" in data
              assert "type=application,service" in data and "preuninstall=scripts/preun.sh" in data
              assert "[service.0]" in data and "name=netguard" in data
              assert "uid=root" in data and "mode=restart" in data
              assert {"svc/netguard.sh","scripts/preun.sh","notices/NETGUARD_LICENSE.txt"}.issubset(z.namelist())
              guard = z.read("svc/netguard.sh")
              assert all(s in guard for s in (b"APP_PKG=com.gen5.stremio",b"CHAIN=stremio_net",b"iptables ip6tables",b"lo wlan+ bnep+ bt-pan+ usb+ rndis+",b"--uid-owner",b"15"))
              assert b"stremio_net" in z.read("scripts/preun.sh")
              assert b"MIT License" in z.read("notices/NETGUARD_LICENSE.txt")
              assert b'shared_prefs/network.xml' in guard, "Settings-to-firewall preference bridge missing"
              assert b'use_internal_modem' in guard, "Modem toggle handling missing from firewall"
              assert b'unblock()' in guard, "Firewall removal missing"
              assert b'if use_internal_modem; then' in guard, "Firewall mode switch missing"
              assert b'NETGUARD_INTERVAL:-2' in guard, "Two-second setting update missing"
              apk = z.read("app/StremioAuto.apk")
          with zipfile.ZipFile(BytesIO(apk)) as z:
              assert z.testzip() is None
              dex = b"".join(z.read(n) for n in z.namelist() if n.endswith(".dex"))
              for pattern in (rb"tim[.]llt", rb"verizon[.]net"):
                  assert re.search(pattern, dex, re.IGNORECASE) is None
              assert any("stremio_auto_icon.webp" in n for n in z.namelist()), "Pixel launcher icon missing from APK"
              icon_bytes = next(z.read(n) for n in z.namelist() if n.endswith("/stremio_auto_icon.webp"))
              assert icon_bytes == pathlib.Path("app/src/main/res/drawable-nodpi/stremio_auto_icon.webp").read_bytes(), "Compiled icon differs from selected image"
              assert all("assets/flags/"+code+".png" in z.namelist() for code in ("gb","us","es","fr","de","jp")), "Bundled language flags missing from APK"
              assert b"FlagText" in dex, "Android 4.4 flag renderer missing from APK"
              assert b"STREMIO AUTO" in dex, "Stremio Auto app name missing from APK"
              assert b"VLC is not network protected" in dex, "External VLC network warning missing from APK"
              assert b"Use Internal Modem" in dex, "Internal modem setting missing from APK"
              assert b"use_internal_modem" in dex, "Persisted modem preference missing from APK"
              assert b"PARKED VEHICLE REQUIRED" in dex, "Subsequent parked-use dialog missing from APK"
              assert b"PARKED VEHICLE LOCK ENABLED" in dex, "Welcome safety heading missing from APK"
              assert b"Welcome to Stremio Auto!" in dex, "Welcome title missing from APK"
              assert b"Before you start watching, check out Settings." in dex, "Welcome copy missing from APK"
              assert b"welcome_seen" in dex, "One-time preference missing from APK"
              assert b"PlaybackSync" in dex, "Cloud playback sync missing from compiled APK"
              assert b"sync_video_id" in dex, "Episode identity missing from APK"
              assert b"cloud_sync_status" in dex, "Sync status feedback missing"
              assert b"Choose an episode" in dex, "Episode selection missing"
              assert b"SYNC WATCH PROGRESS" not in dex, "Obsolete manual VLC timestamp form remains"
              assert b"Minutes watched, for example 37" not in dex, "Obsolete timecode input remains"
              assert "I'm Parked — Let's Go".encode("utf-8") in dex, "Combined first-use button missing from APK"
              assert b"parked_confirmed" in dex, "Player acknowledgement guard absent from compiled APK"
              assert b"Exit App" in dex, "Exit option absent from APK"
              for phrase in [b"Motion lockout", b"Disable popup", b"Exit Stremio", b"motion_lockout", b"disable_popup", b"2 mph", b"Yes, Exit", b"VLC integration", b"vlc_integration"]:
                  assert phrase in dex, f"Required app setting or control missing from APK: {phrase!r}"


          shutil.copyfile(src, dst)
          print(f"Validated public installer: {dst} ({dst.stat().st_size} bytes)")
          PY
          sha256sum dist/Stremio-gen5-hmg-nemesis-v1.1.2-USB-Installer.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[ship-v1.1.2]'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Release only when the Git tag matches the APK's actual version.
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "$tag" || {
              echo "Release tag $GITHUB_REF_NAME does not match versionName $version" >&2
              exit 1
            }
          else
            test "$tag" = "v1.1.2" || {
              echo "One-shot launch marker can only publish v1.1.2" >&2
              exit 1
            }
          fi
          cat > dist/release-notes.md <<'NOTES'
          # Stremio Auto v1.1.2 — Automatic Stremio Watch Sync

          Stremio Auto is an unofficial community client for NEMESIS-enabled Hyundai/Kia/Genesis Android 4.4 head units.

          ### What's new

          - **Automatic built-in player sync:** Progress now saves to your signed-in Stremio account while watching (approximately every 30 seconds), on pause, when leaving the player, and at playback completion. There is no manual timecode entry.
          - **Continue Watching across devices:** Watch-only movies and series get temporary Stremio watch-history entries without being added to your saved Library. Other devices should see progress after account refresh when the Stremio server accepts the update.
          - **Episode selection:** Choose a season and episode before retrieving a series stream. This supplies the real episode video ID that Stremio needs for cross-device playback history.
          - **Cleaner UI:** Removed the manual VLC playback minutes field. VLC remains optional as a last-resort external fallback and does not promise account progress synchronization.
          - The existing first-launch welcome, parking confirmation, internal modem toggle, NEMESIS network guard, ExoPlayer controls, FFmpeg audio and selected launcher icon are preserved.

          ### Installation

          Download **Stremio-gen5-hmg-nemesis-v1.1.2-USB-Installer.zip**. Extract its three items to the USB drive root and install through NEMESIS after the Android head unit is fully booted. The installer cleans only Stremio Auto's package, clearing local login, settings and cache.

          ### Caveats

          Cloud sync needs a signed-in Stremio account, a working connection, the correct movie/episode IDs and a successful Stremio API write. The car-to-TV sync behavior has not yet been tested with a real account; check **Info → Stremio cloud watch sync** after playback for status. Unexpected disconnections can prevent the latest progress from syncing. Android DNS and external VLC are outside the app firewall protection. Use video only while parked.
          NOTES
          # Never replace assets or source behind an already published version.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it untouched."
            exit 0
          fi
          gh release create "$tag" \
            "dist/Stremio-gen5-hmg-nemesis-v1.1.2-USB-Installer.zip" \
            "dist/Stremio-gen5-hmg-nemesis-v1.1.2-Source.zip" \
            --title "Stremio Auto v1.1.2" \
            --notes-file dist/release-notes.md \
            --target "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: StremioAuto-build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            dist/*.zip
